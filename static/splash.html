<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Friendolls Splash</title>
    <script>
      document.addEventListener("contextmenu", function (e) {
        e.preventDefault();
      });
    </script>
  </head>
  <body style="width: 100%; height: 100%">
    <div id="splash"></div>
    <script>
      document.getElementById("splash").style.backgroundImage =

    <style>
      * {
        margin: 0;
      }
      #splash {
        background-size: cover;
        background-position: center;
        width: 500px;
        height: 290px;
      }
    </style>
  </body>
</html>
